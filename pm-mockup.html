<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM Mockup</title>
<!--
  プロジェクト管理ツール モックアップ（単一HTML / 外部ネットワーク通信なし・オフラインで動作）
  データは JSON でエクスポート/インポート可能。Rust 側では以下の構造体に対応する想定:

  #[derive(Serialize, Deserialize)]
  struct Project { name: String, members: Vec<String>, tasks: Vec<Task> }
  #[derive(Serialize, Deserialize)]
  struct Task {
      id: u32, title: String, assignee: String,
      status: Status,            // "todo" | "doing" | "review" | "done"
      start: NaiveDate, end: NaiveDate, progress: u8,
      memo: String, links: Vec<Link>, logs: Vec<LogEntry>,
  }
  struct Link { kind: String, label: String, url: String }   // kind: 検証記録 / 仕様書 / 成果物 / その他
  struct LogEntry { date: NaiveDate, text: String }

  // 回路設計仕様書（#[serde(rename_all = "camelCase")]）
  struct SpecDoc { id: u32, title: String, doc_no: String, version: String, author: String,
                   updated: NaiveDate, sections: Vec<Section> }
  struct Section { id: u32, kind: SectionKind,   // "toc" | "spec" | "free"
                   title: String, prefix: Option<String>,   // spec のみ: "A", "B" …
                   md: String, fixed: bool }
  // 番号付け: spec セクション内の Markdown 見出し "#" → A1, "##" → A1.1, "###" → A1.1.1
  // Markdown 出力時に番号を見出しへ埋め込み、目次・仕様一覧表を自動生成する

  // Outlook 連携（このモックでは送信・登録は行わず、送信履歴に記録するだけ）
  //   実装想定: Microsoft Graph API + OAuth2（認可コード + PKCE。oauth2 / reqwest クレート）
  //   権限:     User.Read, Calendars.ReadWrite, Mail.Send（offline_access でリフレッシュトークン保持）
  //   カレンダー: POST /me/events → 返ってきた event.id を Task.cal に保存、更新は PATCH /me/events/{id}
  //   メール:     POST /me/sendMail（担当者割り当て時・ステータス変更時）
  struct OutlookSettings { connected: bool, account: String, notify_assign: bool, notify_status: bool,
                           remind_days: u8, cal_mode: String /* allday | start */, auto_sync: bool }
  // Task に追加: cal: Option<CalLink { id: String, start, end, title, at }>
  // Project に追加: member_emails: HashMap<String, String>, outbox: Vec<MailLog>

  // 回路図ビューア
  //   モック: PDF.js（legacy ビルド）を HTML に埋め込んで描画（外部通信なし）。起動できない場合はブラウザ標準の PDF ビューアに切り替え
  //           追加した PDF はブラウザの IndexedDB に保存（サンプル図面は HTML に埋め込み）
  //   Rust/Tauri 実装時: PDF.js を同梱し、ファイルはパスで参照（std::fs で読み込み → フロントへ渡す）
  struct Schematic { id: u32, name: String, rev: String, path: String, spec_id: Option<u32>,
                     pages: u32, pins: Vec<Pin> }
  struct Pin { id: u32, page: u32, x: f32, y: f32 /* ページ内の相対座標 0..1 */, label: String, note: String }
  // 注記の label/note に [A1.1] と書くと仕様書、#3 と書くとタスクへリンク
-->
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e2e5ea; --line2:#eef0f3; --text:#1c2230; --muted:#6a7284;
  --accent:#3b5bfd; --accent-weak:#e9edff; --danger:#d93f45;
  --todo:#97a0b0; --doing:#3b7bfd; --review:#e09a2c; --done:#2b9e67;
  --weekend:#f0f2f5; --today:#e5484d; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --lw:340px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#13161b; --panel:#1b1f26; --line:#2a303a; --line2:#222730; --text:#e5e8ee; --muted:#959eae;
    --accent:#7d8dff; --accent-weak:#252b47; --weekend:#181c22; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px}
.proj{font-weight:600;border:1px solid transparent;background:none;padding:3px 6px;border-radius:6px;min-width:0;width:14.5em}
.proj:hover,.proj:focus{border-color:var(--line);outline:none}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{border:0;background:none;padding:5px 14px;border-radius:6px;color:var(--muted);font-weight:600}
.tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.spacer{flex:1}
.search{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;width:170px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}

/* stats */
.stats{display:flex;gap:22px;padding:10px 18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.stat{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:12px}
.stat b{font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--danger)}
.overall{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter{width:160px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--done)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex;flex-direction:column}

/* gantt */
.g-tool{display:flex;gap:8px;align-items:center;padding:10px 18px;font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:3px 10px;color:var(--muted)}
.seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.g-wrap{flex:1;min-height:0;margin:0 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.g-scroll{height:100%;overflow:auto}
.g-inner{position:relative}
.g-head{display:flex;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.g-left{width:var(--lw);flex:none;position:sticky;left:0;background:var(--panel);z-index:3;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 64px 76px;align-items:center;padding:0 12px;gap:8px}
.g-head .g-left{z-index:6;font-size:11px;color:var(--muted);font-weight:600}
.g-scale{flex:none}
.g-months,.g-days{display:flex}
.g-months div{border-left:1px solid var(--line);font-size:11px;font-weight:600;padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden}
.g-days div{flex:none;text-align:center;font-size:10px;color:var(--muted);border-left:1px solid var(--line2);padding:2px 0 4px;line-height:1.25}
.g-days div.we{color:#c2c7d0}
.g-days div.td{color:#fff;background:var(--today);font-weight:700}
.g-body{position:relative}
.g-bg{position:absolute;top:0;bottom:0;pointer-events:none}
.g-bg .we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.g-bg .tl{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.75}
.g-row{display:flex;height:42px;border-bottom:1px solid var(--line2)}
.g-row:hover .g-left,.g-row.sel .g-left{background:var(--accent-weak)}
.g-row .g-left{cursor:pointer}
.g-title{display:flex;align-items:center;gap:8px;min-width:0}
.g-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-title .id{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.g-assignee{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.g-prog{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-prog .meter{width:36px;height:4px}
.g-track{flex:none;position:relative}
.bar{position:absolute;top:9px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--c) 28%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 70%,transparent);cursor:grab;touch-action:none;user-select:none}
.bar:active{cursor:grabbing}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px 0 0 5px}
.bar .fill.full{border-radius:5px}
.bar .pct{position:absolute;left:6px;top:0;line-height:22px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35);pointer-events:none}
.bar .lbl{position:absolute;left:calc(100% + 8px);top:0;line-height:22px;font-size:12px;white-space:nowrap;color:var(--text);pointer-events:none}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h-l{left:-2px}.bar .h-r{right:-2px}
.bar.late{box-shadow:0 0 0 2px var(--danger)}
.bar.sel{box-shadow:0 0 0 2px var(--accent)}
.tip{position:fixed;z-index:50;background:#111827;color:#fff;font-size:11px;padding:4px 8px;border-radius:5px;pointer-events:none;display:none;white-space:nowrap}

/* kanban */
.k-board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;padding:16px 18px 18px;overflow-x:auto}
.k-col{background:color-mix(in srgb,var(--line2) 70%,var(--bg));border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.k-col.over{outline:2px dashed var(--accent);outline-offset:-3px}
.k-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:13px}
.k-head .n{color:var(--muted);font-weight:500;font-size:12px}
.k-head .btn{margin-left:auto;padding:2px 8px;font-size:12px}
.k-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));border-left-color:var(--c)}
.card.dragging{opacity:.4}
.card .t{font-weight:600;margin-bottom:6px;display:flex;gap:6px}
.card .t .id{color:var(--muted);font-weight:500;font-size:11px;padding-top:2px}
.card .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.card .meta .late{color:var(--danger);font-weight:600}
.card .meter{width:auto;flex:1;height:4px;margin:8px 0 6px}
.card .meter>i{background:var(--c)}
.ico{display:inline-flex;align-items:center;gap:3px}
.ico svg{width:13px;height:13px}
.avatar{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.card .lastlog{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.d-head .id{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.d-title{flex:1;font-size:17px;font-weight:700;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px;min-width:0}
.d-title:hover,.d-title:focus{border-color:var(--line);outline:none}
.d-body{flex:1;overflow-y:auto;padding:16px 18px 24px}
.fields{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:center;margin-bottom:22px}
.fields label{color:var(--muted);font-size:12px}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.row2{display:flex;gap:8px;align-items:center}
.row2 input[type=range]{flex:1;accent-color:var(--accent)}
.pctbox{width:70px}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.sec h3 .btn{margin-left:auto;font-size:12px;padding:2px 10px}
.links{display:flex;flex-direction:column;gap:6px}
.link{display:grid;grid-template-columns:92px 1fr auto auto;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.link .inp{background:var(--panel);padding:4px 7px;font-size:12px}
.link .stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.iconbtn{border:0;background:none;color:var(--muted);padding:4px;border-radius:5px;display:grid;place-items:center;text-decoration:none}
.iconbtn:hover{background:var(--line2);color:var(--text)}
.iconbtn svg{width:15px;height:15px}
.kind{font-size:11px;font-weight:600;border-radius:5px;padding:4px 6px;border:0;width:100%}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
.memo-tabs{display:flex;gap:2px;margin-left:auto}
.memo-tabs button{border:0;background:none;font-size:12px;padding:2px 8px;border-radius:5px;color:var(--muted)}
.memo-tabs button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
textarea.inp{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6}
.preview{border:1px solid var(--line);border-radius:7px;padding:10px 12px;min-height:150px;white-space:pre-wrap;word-break:break-all;font-size:13px}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.logs{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.log{position:relative;font-size:13px}
.log:before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.log .d .iconbtn{padding:0;opacity:0}
.log:hover .d .iconbtn{opacity:1}
.log-add{display:flex;gap:6px;margin-bottom:12px}
.d-foot{display:flex;padding:12px 18px;border-top:1px solid var(--line);gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.d-foot .btn{margin-left:auto}

/* spec */
.s-layout{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr}
.s-side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:2px}
.s-docsel{display:flex;gap:6px;margin-bottom:10px}
.s-docsel select{font-weight:600}
.s-label{font-size:11px;font-weight:700;color:var(--muted);padding:12px 8px 4px;letter-spacing:.04em}
.sec-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;margin-top:2px}
.sec-item:hover{background:var(--bg)}
.sec-item.on{background:var(--accent-weak);color:var(--accent)}
.sec-item .sno{color:var(--muted);font-variant-numeric:tabular-nums;width:18px;flex:none;font-size:12px}
.sec-item.on .sno{color:var(--accent)}
.sec-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-item .pfx{font-size:10px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--line2);color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.sec-item .acts{display:none;gap:0}
.sec-item:hover .acts{display:flex}
.sec-item:hover .pfx{display:none}
.sec-item .acts .iconbtn{padding:1px 4px;font-size:12px}
.sec-item .acts .iconbtn svg{width:12px;height:12px}
.iconbtn.confirm{color:#fff;background:var(--danger)}
.spec-item{display:flex;gap:8px;padding:2px 8px 2px calc(30px + 12px * var(--lv));font-size:12px;color:var(--muted);cursor:pointer;border-radius:5px;line-height:1.7}
.spec-item:hover{background:var(--bg);color:var(--text)}
.spec-item b{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--text);flex:none;font-size:11.5px}
.spec-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addsec{margin-top:10px;justify-content:flex-start;color:var(--accent);text-align:left}
.s-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.s-tool{display:flex;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.s-tool .btn{padding:4px 10px;font-size:13px}
.s-tt{font-size:14px}
.s-sub{font-size:11px;color:var(--muted)}
.s-name{width:200px;font-weight:600}
.s-kind{width:auto}
.s-pfx{width:52px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700}
.inp.bad{border-color:var(--danger);outline-color:transparent}
.s-div{width:1px;height:20px;background:var(--line);margin:0 4px}
.s-panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.s-panes.edit,.s-panes.preview{grid-template-columns:minmax(0,1fr)}
.s-panes.edit .s-preview,.s-panes.preview .s-editor{display:none}
.s-editor{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.s-editor textarea{flex:1;border:0;resize:none;padding:16px 20px;background:var(--panel);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;outline:none;tab-size:2}
.s-foot{display:flex;gap:14px;align-items:center;padding:7px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.s-foot code{background:var(--bg);padding:0 5px;border-radius:4px}
.s-form{padding:20px 22px;overflow-y:auto}
.s-help h4{margin:0 0 6px;font-size:13px}
.s-help p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.s-help table{border-collapse:collapse;font-size:12.5px;margin-bottom:18px}
.s-help td{border:1px solid var(--line);padding:4px 10px}
.s-help td:first-child{font-family:ui-monospace,Menlo,monospace}
.s-preview{overflow-y:auto;padding:24px;background:var(--bg);position:relative}
.doc{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px 44px 48px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.75}
.doc h1{font-size:22px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--text)}
.doc h2{font-size:17px;margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc h3{font-size:15px;margin:24px 0 8px}
.doc h4{font-size:14px;margin:16px 0 6px}
.doc h5,.doc h6{font-size:13.5px;margin:12px 0 4px}
.doc .no{font-family:ui-monospace,Menlo,monospace;color:var(--accent);margin-right:10px;font-weight:700}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0 14px}
.doc th,.doc td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--bg);font-weight:600}
.doc code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
.doc pre{background:var(--bg);padding:10px 14px;border-radius:6px;overflow:auto}
.doc pre code{padding:0;background:none}
.doc blockquote{border-left:3px solid var(--line);margin:8px 0;padding:2px 14px;color:var(--muted)}
.doc ul,.doc ol{padding-left:22px;margin:6px 0}
.doc p{margin:6px 0}
.doc a{word-break:break-all}
.doc .refs{display:inline-flex;gap:4px;margin-left:10px;vertical-align:2px}
.doc .ref{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--accent-weak);color:var(--accent);border:0}
a.specref{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--accent-weak);padding:0 5px;border-radius:4px;text-decoration:none;font-weight:600}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 22%,transparent)}to{background:transparent}}
.doc .flash{animation:flash 1.6s ease-out;border-radius:4px}

/* outlook */
.ol-dot{width:8px;height:8px;border-radius:50%;background:var(--todo);display:inline-block;margin-right:7px;vertical-align:1px}
.ol-dot.on{background:var(--done)}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(10,14,22,.35);padding:16px}
.modal.on{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.mhead h2{margin:0;font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
.ol-logo{width:22px;height:22px;border-radius:5px;background:#0f6cbd;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.mbody{overflow-y:auto;padding:18px 18px 24px}
.mbody h4{margin:18px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.mbody h4:first-child{margin-top:0}
.mock-note{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:7px 10px;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.chk select{width:auto;padding:2px 6px}
.perm code{font-size:11px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:4px;margin-right:4px}
.mrow{display:grid;grid-template-columns:130px 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.mrow .n{display:flex;align-items:center;gap:8px;font-weight:600}
.mail{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12.5px}
.mail summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.mail summary::-webkit-details-marker{display:none}
.mail .at{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;flex:none}
.mail .sj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mail .to{color:var(--muted);font-size:11px;flex:none}
.mail pre{white-space:pre-wrap;font:inherit;margin:8px 0 2px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.ol-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:10px;font-size:13px}
.ol-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ol-row .lb{color:var(--muted);font-size:12px;width:84px;flex:none}
.ol-row .btn{padding:3px 10px;font-size:12px}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.pill.warn{background:color-mix(in srgb,var(--review) 18%,transparent);color:var(--review)}
.pill.off{background:var(--line2);color:var(--muted)}
.evt{font-size:12px;color:var(--muted);border-left:3px solid #0f6cbd;padding:6px 10px;background:var(--panel);border-radius:0 6px 6px 0;line-height:1.7}
.evt b{color:var(--text);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.card .olc{color:#0f6cbd}

/* schematic viewer */
.c-layout{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 300px}
.c-side,.c-notes{background:var(--panel);overflow-y:auto;padding:12px 10px 20px}
.c-side{border-right:1px solid var(--line)}
.c-notes{border-left:1px solid var(--line);padding:12px 12px 20px}
.c-notes h3{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 8px;display:flex;gap:6px;align-items:center}
.sch-item{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.sch-item:hover{background:var(--bg)}
.sch-item.on{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.sch-item .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-item .sub{font-size:11px;color:var(--muted)}
.c-meta{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12px;margin:4px 0}
.c-meta label{color:var(--muted)}
.c-meta .inp{padding:4px 7px;font-size:12px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 2px}
.thumb{border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:2px;position:relative}
.thumb.on{border-color:var(--accent)}
.thumb img{width:100%;display:block}
.thumb span{position:absolute;bottom:4px;right:5px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px}
.c-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.c-tool{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;min-height:47px}
.c-tool .btn{padding:4px 10px;font-size:13px;text-decoration:none;color:var(--text)}
.c-tool .btn:disabled{opacity:.4;cursor:default}
.c-tool .pg{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.c-view{flex:1;min-height:0;overflow:auto;background:color-mix(in srgb,var(--line) 55%,var(--bg));padding:20px;position:relative}
.c-view.drag{outline:3px dashed var(--accent);outline-offset:-10px}
.c-page{position:relative;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.c-page canvas{display:block;width:100%;height:100%}
.c-page.pinmode{cursor:crosshair}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;z-index:2}
.pin .head{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;transition:transform .12s}
.pin .lab{position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(17,24,39,.88);color:#fff;font-size:11px;padding:2px 8px;border-radius:5px;pointer-events:none;display:none}
.pin:hover .lab,.pin.sel .lab{display:block}
.pin.sel{z-index:3}
.pin.sel .head{background:var(--danger);transform:scale(1.2)}
.c-view.hidepins .pin{display:none}
.c-empty{max-width:440px;margin:60px auto;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px;padding:36px 24px;background:var(--panel);font-size:13px}
.c-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.c-empty .btn{margin-top:14px}
.c-fallback{height:calc(100% - 46px);width:100%;border:0;background:#fff;border-radius:6px}
.note{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)}
.note.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.note .nt-top{display:flex;gap:6px;align-items:center}
.note .num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;cursor:pointer}
.note.sel .num{background:var(--danger)}
.note .pgl{font-size:10px;color:var(--muted);flex:none;cursor:pointer}
.note .inp{padding:4px 7px;font-size:12px;background:var(--panel)}
.note textarea.inp{min-height:46px;margin-top:6px;font-family:inherit;font-size:12px;line-height:1.5;resize:vertical}
.note .lk{font-size:11px;margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.note .lk:empty{display:none}
a.taskref{font-size:.92em;background:color-mix(in srgb,var(--review) 16%,transparent);color:var(--review);padding:0 5px;border-radius:4px;text-decoration:none;font-weight:600}
.doc .ref.pinref{background:color-mix(in srgb,var(--done) 14%,transparent);color:var(--done)}

@media (max-width:1100px){ .c-layout{grid-template-columns:220px minmax(0,1fr)} .c-notes{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:240px} }
@media (max-width:760px){
  .c-layout{grid-template-columns:minmax(0,1fr)}
  .c-side{max-height:160px;border-right:0;border-bottom:1px solid var(--line)}
  .c-view{padding:10px}
  .mrow{grid-template-columns:1fr auto}
  .mrow .n{grid-column:1/-1}
  .s-layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .s-side{max-height:190px;border-right:0;border-bottom:1px solid var(--line)}
  .s-panes{grid-template-columns:minmax(0,1fr)}
  .s-panes.split .s-preview{display:none}
  .doc{padding:22px 18px}
  .s-preview{padding:12px}

  :root{--lw:190px}
  .g-left{grid-template-columns:1fr 50px}
  .g-assignee{display:none}
  .g-head .g-left span:nth-child(2){display:none}
  .legend{display:none}
  .search{width:130px}
  .top,.stats,.g-tool{padding-left:16px;padding-right:16px}
  .g-wrap{margin:0 16px 16px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="logo">PM</div></div>
  <input class="proj" id="projName" aria-label="プロジェクト名">
  <div class="tabs" role="tablist">
    <button class="tab on" data-view="gantt">ガントチャート</button>
    <button class="tab" data-view="kanban">カンバン</button>
    <button class="tab" data-view="spec">仕様書</button>
    <button class="tab" data-view="schem">回路図</button>
  </div>
  <div class="spacer"></div>
  <input class="search" id="q" placeholder="タスクを検索…">
  <button class="btn" id="outlookBtn" title="Outlook 連携の設定"><span class="ol-dot"></span>Outlook</button>
  <button class="btn" id="exportBtn" title="Rust側に渡すJSONとして書き出し">JSON書き出し</button>
  <button class="btn" id="importBtn">読み込み</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <button class="btn primary" id="newBtn">＋ 新規タスク</button>
</header>

<section class="stats" id="stats"></section>

<main>
  <section class="view on" id="v-gantt">
    <div class="g-tool">
      <span>表示幅</span>
      <div class="seg" id="zoom"><button data-w="22">狭</button><button data-w="34" class="on">標準</button><button data-w="50">広</button></div>
      <button class="btn ghost" id="toToday">今日へ移動</button>
      <span style="margin-left:auto">バーをドラッグで日程移動・端をドラッグで期間変更・クリックで詳細</span>
    </div>
    <div class="g-wrap"><div class="g-scroll" id="gScroll"><div class="g-inner" id="gantt"></div></div></div>
  </section>
  <section class="view" id="v-kanban">
    <div class="k-board" id="kanban"></div>
  </section>
  <section class="view" id="v-spec">
    <div class="s-layout">
      <nav class="s-side" id="specSide" aria-label="仕様書の構成"></nav>
      <div class="s-main">
        <div class="s-tool" id="specTool"></div>
        <div class="s-panes split" id="specPanes">
          <div class="s-editor" id="specEditor"></div>
          <div class="s-preview" id="specPreview"></div>
        </div>
      </div>
    </div>
  </section>
  <section class="view" id="v-schem">
    <div class="c-layout">
      <nav class="c-side" id="schSide" aria-label="回路図一覧"></nav>
      <div class="c-main">
        <div class="c-tool" id="schTool"></div>
        <div class="c-view" id="schView"></div>
      </div>
      <aside class="c-notes" id="schNotes" aria-label="注記"></aside>
    </div>
    <input type="file" id="schFile" accept="application/pdf,.pdf" hidden>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="タスク詳細"></aside>
<div class="tip" id="tip"></div>
<div class="modal" id="olModal" role="dialog" aria-label="Outlook 連携"><div class="mbox" id="olBox"></div></div>
<div class="toast" id="toast"></div>

let state = load();
let view = 'gantt', query = '', dw = 34, selectedId = null, memoMode = 'edit';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const toN = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/DAY; };
const toS = n => new Date(n*DAY).toISOString().slice(0,10);
const md = s => { const [,m,d] = s.split('-'); return `${+m}/${+d}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const specRefs = h => h.replace(REF_RE, (_, r) => `<a href="#" class="specref" data-spec="${r}" title="仕様書の ${r} を開く">${r}</a>`);
const linkify = t => specRefs(esc(t).replace(/(https?:\/\/[^\s<]+|file:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`));
const st = id => STATUSES.find(s => s.id === id);
const task = id => state.tasks.find(t => t.id === id);
const isLate = t => t.status !== 'done' && toN(t.end) < toN(TODAY);
const memberColor = name => MEMBER_COLORS[Math.max(0, state.members.indexOf(name)) % MEMBER_COLORS.length];
const avatar = name => name ? `<span class="avatar" style="background:${memberColor(name)}" title="${esc(name)}">${esc(name.slice(0,1))}</span>` : '';
const ICON = {
  memo:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h10v11H3z"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>',
  link:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 9.5l3-3"/><path d="M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1"/></svg>',
  cal:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>',
  open:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5"/><path d="M12 9.5v4H2.5V4h4"/></svg>',

  calok:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3M5.8 10l1.6 1.5 3-3"/></svg>',
  mail:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M2.5 4.5L8 9l5.5-4.5"/></svg>',
};

function load(){
  let s = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) s = JSON.parse(raw); } catch(e){}
  s = s || structuredClone(SAMPLE);
  if (!Array.isArray(s.specs) || !s.specs.length) s.specs = [structuredClone(SPEC_SAMPLE)];
  s.outlook = {...OL_DEFAULT, ...(s.outlook || {})};
  s.memberEmails = s.memberEmails || {...MEMBER_EMAILS};
  s.outbox = s.outbox || [];
  s.schematics = s.schematics || structuredClone(SCH_SAMPLE);
  return s;
}
function save(){
  autoSyncCalendar();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function filtered(){
  const q = query.trim().toLowerCase();
  const list = [...state.tasks].sort((a,b) => toN(a.start)-toN(b.start) || a.id-b.id);
  if (!q) return list;
  return list.filter(t => [t.title,t.assignee,t.memo,...t.links.map(l=>l.label)].join(' ').toLowerCase().includes(q));
}

/* ---------- render ---------- */
function render(){
  $('#projName').value = state.name;
  $('#outlookBtn').innerHTML = `<span class="ol-dot ${state.outlook.connected ? 'on' : ''}"></span>Outlook${state.outlook.connected ? '' : '（未接続）'}`;
  renderStats();
  if (view === 'gantt') renderGantt();
  else if (view === 'kanban') renderKanban();
  else if (view === 'spec') renderSpec();
  else renderSchem();
}

function renderStats(){
  const ts = state.tasks;
  const total = ts.length;
  const done = ts.filter(t => t.status==='done').length;
  const late = ts.filter(isLate).length;
  const avg = total ? Math.round(ts.reduce((a,t)=>a+t.progress,0)/total) : 0;
  const cnt = id => ts.filter(t => t.status===id).length;
  $('#stats').innerHTML = `
    <div class="overall">全体進捗 <div class="meter"><i style="width:${avg}%"></i></div><b style="color:var(--text);font-size:13px">${avg}%</b></div>
    <div class="stat"><b>${total}</b>タスク</div>
    <div class="stat"><b>${done}</b>完了</div>
    <div class="stat"><b>${cnt('doing')}</b>進行中</div>
    <div class="stat"><b>${cnt('review')}</b>検証中</div>
    <div class="stat ${late?'warn':''}"><b>${late}</b>遅延</div>
    <div class="legend">${STATUSES.map(s=>`<span><i class="dot" style="background:${s.c}"></i>${s.label}</span>`).join('')}
      <span><i class="dot" style="background:none;box-shadow:0 0 0 2px var(--danger)"></i>期限超過</span></div>`;
}

function renderGantt(){
  const all = state.tasks;
  const min = Math.min(toN(TODAY), ...all.map(t=>toN(t.start))) - 3;
  const max = Math.max(toN(TODAY), ...all.map(t=>toN(t.end))) + 10;
  ganttMin = min;
  const days = max - min + 1, W = days * dw, today = toN(TODAY);

  // months
  let months = '', cur = null, span = 0;
  const flush = () => { if (cur) months += `<div style="width:${span*dw}px">${cur}</div>`; };
  for (let n = min; n <= max; n++){
    const s = toS(n), label = `${s.slice(0,4)}年${+s.slice(5,7)}月`;
    if (label !== cur){ flush(); cur = label; span = 0; }
    span++;
  }
  flush();
  // days + weekends
  const WD = '日月火水木金土';
  let dayCells = '', bg = '';
  for (let n = min; n <= max; n++){
    const d = new Date(n*DAY), wd = d.getUTCDay(), we = wd===0||wd===6;
    dayCells += `<div class="${we?'we':''} ${n===today?'td':''}" style="width:${dw}px">${dw>=30?WD[wd]+'<br>':''}${d.getUTCDate()}</div>`;
    if (we) bg += `<div class="we" style="left:${(n-min)*dw}px;width:${dw}px"></div>`;
  }
  bg += `<div class="tl" style="left:${(today-min)*dw + dw/2 - 1}px"></div>`;

  const rows = filtered().map(t => {
    const s = st(t.status), x = (toN(t.start)-min)*dw, w = (toN(t.end)-toN(t.start)+1)*dw;
    const cls = ['bar', isLate(t)?'late':'', t.id===selectedId?'sel':''].join(' ');
    return `<div class="g-row ${t.id===selectedId?'sel':''}">
      <div class="g-left" data-open="${t.id}">
        <div class="g-title"><span class="id">#${t.id}</span><i class="dot" style="background:${s.c};flex:none"></i><span>${esc(t.title)}</span></div>
        <div class="g-assignee">${esc(t.assignee)}</div>
        <div class="g-prog"><div class="meter"><i style="width:${t.progress}%;background:${s.c}"></i></div>${t.progress}%</div>
      </div>
      <div class="g-track" style="width:${W}px">
        <div class="${cls}" data-id="${t.id}" style="--c:${s.c};left:${x}px;width:${w}px">
          <div class="fill ${t.progress>=100?'full':''}" style="width:${t.progress}%"></div>
          ${w>=44?`<span class="pct">${t.progress}%</span>`:''}
          <span class="lbl">${esc(t.title)}</span>
          <div class="h h-l"></div><div class="h h-r"></div>
        </div>
      </div>
    </div>`;
  }).join('');

  $('#gantt').style.width = `calc(var(--lw) + ${W}px)`;
  $('#gantt').innerHTML = `
    <div class="g-head">
      <div class="g-left"><span>タスク</span><span>担当</span><span>進捗</span></div>
      <div class="g-scale" style="width:${W}px"><div class="g-months">${months}</div><div class="g-days">${dayCells}</div></div>
    </div>
    <div class="g-body">
      <div class="g-bg" style="left:var(--lw);width:${W}px">${bg}</div>
      ${rows || '<div class="empty" style="padding:24px">該当するタスクはありません</div>'}
    </div>`;
}

function scrollToToday(){
  const sc = $('#gScroll');
  sc.scrollLeft = Math.max(0, (toN(TODAY)-ganttMin)*dw - 160);
}

function renderKanban(){
  const list = filtered();
  $('#kanban').innerHTML = STATUSES.map(s => {
    const items = list.filter(t => t.status === s.id);
    return `<div class="k-col" data-status="${s.id}">
      <div class="k-head"><i class="dot" style="background:${s.c}"></i>${s.label}<span class="n">${items.length}</span>
        <button class="btn ghost" data-add="${s.id}" title="${s.label}にタスクを追加">＋</button></div>
      <div class="k-list">${items.map(card).join('') || '<div class="empty" style="text-align:center">ここにドラッグ</div>'}</div>
    </div>`;
  }).join('');
}
function card(t){
  const s = st(t.status), last = t.logs[t.logs.length-1];
  return `<div class="card" draggable="true" data-id="${t.id}" style="--c:${s.c}">
    <div class="t"><span class="id">#${t.id}</span><span>${esc(t.title)}</span></div>
    <div class="meta">
      <span class="ico ${isLate(t)?'late':''}">${ICON.cal}${md(t.start)}–${md(t.end)}${isLate(t)?' 期限超過':''}</span>
      ${t.memo?`<span class="ico" title="メモあり">${ICON.memo}</span>`:''}
      ${t.links.length?`<span class="ico" title="リンク">${ICON.link}${t.links.length}</span>`:''}
      ${t.cal?`<span class="ico olc" title="Outlook カレンダー登録済み">${ICON.calok}</span>`:''}
      <span style="margin-left:auto">${avatar(t.assignee)}</span>
    </div>
    <div class="row2" style="font-size:11px;color:var(--muted)"><div class="meter"><i style="width:${t.progress}%"></i></div>${t.progress}%</div>
    ${last?`<div class="lastlog" title="${esc(last.text)}">${md(last.date)} ${esc(last.text)}</div>`:''}
  </div>`;
}

          state.outlook.connected && state.outlook.notifyAssign ? '　・割り当て時に通知' : ''}</div>` : ''}
        <label>期間</label>
        <div class="row2"><input class="inp" type="date" data-f="start" value="${t.start}"><span>〜</span><input class="inp" type="date" data-f="end" value="${t.end}"></div>

      </div>

      <div class="sec">

      <div class="sec">

        <div class="links" id="links">${t.links.length ? t.links.map((l,i)=>`

              ${Object.keys(KINDS).map(k=>`<option ${k===l.kind?'selected':''}>${k}</option>`).join('')}</select>
            <div class="stack">
              <input class="inp" data-li="${i}" data-lf="label" value="${esc(l.label)}" placeholder="表示名">

            </div>
            <a class="iconbtn" href="${esc(l.url)}" target="_blank" rel="noopener" title="開く">${ICON.open}</a>
            <button class="iconbtn" data-dellink="${i}" title="削除">${ICON.x}</button>
          </div>`).join('') : '<div class="empty">検証記録のExcel、スクリーンショットのフォルダ、仕様書などのパスやURLを登録できます。</div>'}

function update(fn, rerenderDrawer=false){
  const t = task(selectedId); if (!t) return;
  fn(t); save(); render();
  if (rerenderDrawer) renderDrawer();
}

/* ---------- events ---------- */
function switchView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.view===v));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id==='v-'+v));
  const docView = v==='spec' || v==='schem';
  $('#stats').style.display = docView ? 'none' : '';
  $('#q').style.display = docView ? 'none' : '';
  render(); if (v==='gantt') scrollToToday();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchView(b.dataset.view));
$('#q').oninput = e => { query = e.target.value; render(); };
$('#projName').oninput = e => { state.name = e.target.value; save(); };
$('#zoom').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  dw = +b.dataset.w;
  document.querySelectorAll('#zoom button').forEach(x => x.classList.toggle('on', x===b));
  render(); scrollToToday();
};
$('#toToday').onclick = scrollToToday;

function newTask(status='todo'){
  const id = Math.max(0, ...state.tasks.map(t=>t.id)) + 1;
  state.tasks.push({id,title:'新しいタスク',assignee:'',status,start:TODAY,end:toS(toN(TODAY)+4),progress:status==='done'?100:0,memo:'',links:[],logs:[]});
  save(); openDetail(id);
  setTimeout(() => { const i = $('.d-title'); i && (i.focus(), i.select()); }, 200);
}
$('#newBtn').onclick = () => newTask();

$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:'project.json'});

const tip = $('#tip');
let tipTimer;
function showTip(text, x, y, ms){
  tip.textContent = text; tip.style.display = 'block';
  tip.style.left = (x+12)+'px'; tip.style.top = (y+12)+'px';
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(()=>tip.style.display='none', ms);
}
let drag = null;
$('#gantt').addEventListener('pointerdown', e => {
  const bar = e.target.closest('.bar');
  if (!bar){ const row = e.target.closest('[data-open]'); if (row) openDetail(+row.dataset.open); return; }
  const t = task(+bar.dataset.id);
  const mode = e.target.classList.contains('h-r') ? 'end' : e.target.classList.contains('h-l') ? 'start' : 'move';
  drag = {t, bar, mode, x0:e.clientX, s0:toN(t.start), e0:toN(t.end), ns:toN(t.start), ne:toN(t.end), moved:false};
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
$('#gantt').addEventListener('pointermove', e => {
  if (!drag) return;
  const dd = Math.round((e.clientX - drag.x0) / dw);
  if (Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
  let {s0, e0} = drag, ns = s0, ne = e0;
  if (drag.mode==='move'){ ns = s0+dd; ne = e0+dd; }
  if (drag.mode==='start'){ ns = Math.min(s0+dd, e0); }
  if (drag.mode==='end'){ ne = Math.max(e0+dd, s0); }
  drag.ns = ns; drag.ne = ne;
  drag.bar.style.left = (ns-ganttMin)*dw + 'px';
  drag.bar.style.width = (ne-ns+1)*dw + 'px';
  if (drag.moved) showTip(`${md(toS(ns))} 〜 ${md(toS(ne))}（${ne-ns+1}日）`, e.clientX, e.clientY);
});
$('#gantt').addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null; tip.style.display = 'none';
  if (!d.moved){ openDetail(d.t.id); return; }
  d.t.start = toS(d.ns); d.t.end = toS(d.ne); save(); render();
  if (selectedId === d.t.id) renderDrawer();
});

/* PDF.js は HTML 内に埋め込み（外部ネットワークへの通信なし） */
const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
let pdfjsP = null;
async function inflateEmbedded(id){
  const gz = b64ToBytes(document.getElementById(id).textContent.trim());
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return URL.createObjectURL(new Blob([text], {type: 'text/javascript'}));
}
function loadPdfjs(){
  return pdfjsP ??= (async () => {
    const [libUrl, workerUrl] = await Promise.all([inflateEmbedded('pdfjs-lib'), inflateEmbedded('pdfjs-worker')]);
    const m = await import(libUrl);
    m.GlobalWorkerOptions.workerSrc = workerUrl;
    return m;
  })().catch(e => { pdfjsP = null; throw e; });
}

/* PDF 本体の保存先（IndexedDB。使えない環境ではメモリのみ） */
const memFiles = new Map();
const idb = {
  db: null,
  open(){ return this.db ??= new Promise((res, rej) => { const r = indexedDB.open('pm-mockup-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const r = fn(t.objectStore('files')); t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); }); },
  put(k, v){ return this.tx('readwrite', s => s.put(v, k)); },
  get(k){ return this.tx('readonly', s => s.get(k)); },
  del(k){ return this.tx('readwrite', s => s.delete(k)); },
};
async function getPdfBytes(sch){
  if (!sch.fileKey) return null;
  if (sch.fileKey === 'sample') return b64ToBytes(SAMPLE_PDF_B64);
  if (memFiles.has(sch.fileKey)) return memFiles.get(sch.fileKey);
  try { const v = await idb.get(sch.fileKey); if (v){ memFiles.set(sch.fileKey, v); return v; } } catch(e){}
  return null;
}

async function renderSchemView(){
  const seq = ++renderSeq, sch = curSch(), view = $('#schView');

  const bytes = await getPdfBytes(sch); if (seq !== renderSeq) return;

  let pdfjs;
  try { pdfjs = await loadPdfjs(); }

  renderTask = page.render({canvas, viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined});

async function attachPdf(file, target){
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ toast('PDF ファイルを選んでください'); return; }
  const bytes = new Uint8Array(await file.arrayBuffer());

  memFiles.set(key, bytes);
  let persisted = true; try { await idb.put(key, bytes); } catch(e){ persisted = false; }
  let sch = target;
  if (sch){
    if (sch.fileKey && sch.fileKey !== 'sample') idb.del(sch.fileKey).catch(() => {});
    sch.fileKey = key; sch.fileName = file.name; pdfDocs.delete(sch.id);
  } else {
    sch = {id: nextId(state.schematics), name: file.name.replace(/\.pdf$/i, ''), rev: '', path: '', specId: state.specs[0]?.id ?? null, fileKey: key, fileName: file.name, pages: 0, pins: []};
    state.schematics.push(sch);
  }
  schId = sch.id; schPage = 1; selPin = null; save(); renderSchem();
  toast(persisted ? `「${file.name}」を読み込みました` : `「${file.name}」を読み込みました（この環境では保存できないため、次回は開き直しが必要です）`);
}

/* =====================================================================
   仕様書
   ===================================================================== */
let specId = null, specSecId = null, specMode = 'split';
const curDoc = () => state.specs.find(d => d.id === specId) || state.specs[0];
const nextId = arr => Math.max(0, ...arr.map(x => x.id)) + 1;
const curSec = () => curDoc().sections.find(s => s.id === specSecId);

/* セクション内の見出しを解析して番号を振る（# → A1, ## → A1.1 …） */
function parseSection(sec){
  const items = [];
  if (sec.kind !== 'spec' && sec.kind !== 'free') return items;
  const c = [0,0,0,0,0,0]; let fence = false;
  (sec.md || '').split('\n').forEach((ln, i) => {
    if (/^\s*```/.test(ln)){ fence = !fence; return; }
    if (fence) return;
    const m = ln.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/); if (!m) return;
    const L = m[1].length; c[L-1]++; for (let k = L; k < 6; k++) c[k] = 0;
    items.push({ level:L, title:m[2], line:i, num: sec.kind==='spec' ? sec.prefix + c.slice(0,L).join('.') : null });
  });
  return items;
}
const headText = it => it.num ? `${it.num} ${it.title}` : it.title;

/* GitHub 互換のアンカー生成（重複時は -1, -2 …） */
function makeSlugger(){
  const seen = {};
  return t => {
    let s = t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
    if (seen[s] != null){ seen[s]++; s = `${s}-${seen[s]}`; } else seen[s] = 0;
    return s;
  };
}
/* 文書全体の見出し構成（出力 Markdown の見出し順と一致させる） */
function docOutline(doc){
  const sl = makeSlugger(); sl(doc.title || '');
  const body = doc.sections.filter(s => s.kind !== 'toc');
  const map = new Map(); let tocSlug = null;
  for (const s of doc.sections){
    if (s.kind === 'toc'){ tocSlug = sl('目次'); continue; }
    const head = `${body.indexOf(s) + 1}. ${s.title}`;
    const entry = { sec:s, head, slug: sl(head), items: parseSection(s).map(it => ({...it, text: headText(it)})) };
    entry.items.forEach(it => it.slug = sl(it.text));
    map.set(s.id, entry);
  }
  map.tocSlug = tocSlug;
  return map;
}

/* ---------- Markdown 出力 ---------- */
function buildMarkdown(doc){
  const ol = docOutline(doc), out = [];
  out.push(`# ${doc.title}`, '', '| 項目 | 内容 |', '|---|---|',
    `| 文書番号 | ${doc.docNo || ''} |`, `| 版 | ${doc.version || ''} |`,
    `| 作成者 | ${doc.author || ''} |`, `| 更新日 | ${doc.updated || ''} |`, '');
  for (const s of doc.sections){
    if (s.kind === 'toc'){
      out.push('## 目次', '');
      for (const e of ol.values()){
        out.push(`- [${e.head}](#${e.slug})`);
        e.items.filter(it => it.level <= 2).forEach(it => out.push(`${'  '.repeat(it.level)}- [${it.text}](#${it.slug})`));
      }
      out.push(''); continue;
    }
    const e = ol.get(s.id);
    out.push(`## ${e.head}`, '');
    if (s.kind === 'spec' && e.items.length){
      out.push('| No. | 項目 |', '|---|---|', ...e.items.map(it => `| ${it.num} | ${'　'.repeat(it.level - 1)}${it.title} |`), '');
    }
    const byLine = new Map(e.items.map(it => [it.line, it]));
    (s.md || '').split('\n').forEach((ln, i) => {
      const it = byLine.get(i);
      out.push(it ? `${'#'.repeat(Math.min(6, it.level + 2))} ${it.text}` : ln);
    });
    out.push('');
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

/* ---------- 簡易 Markdown レンダラ（プレビュー用。Rust 側は pulldown-cmark 等を想定） ---------- */
function inlineMd(s){
  let h = esc(s); const codes = [];
  h = h.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length-1}\u0000`; });
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${u}"${u.startsWith('#') ? '' : ' target="_blank" rel="noopener"'}>${t}</a>`);
  h = h.replace(/(^|[^"=>])(https?:\/\/[^\s<]+|file:\/\/[^\s<]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  h = specRefs(h);
  return h.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[n]}</code>`);
}
function mdList(items){
  let html = ''; const stack = [];
  for (const it of items){
    while (stack.length && it.ind < stack[stack.length-1].ind) html += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length-1];
    if (!top || it.ind > top.ind){ const tag = it.ord ? 'ol' : 'ul'; stack.push({ind:it.ind, tag}); html += `<${tag}><li>`; }
    else html += '</li><li>';
    html += inlineMd(it.text);
  }
  while (stack.length) html += `</li></${stack.pop().tag}>`;
  return html;
}
function mdToHtml(src, hooks = {}){
  const lines = src.split('\n'), sl = makeSlugger(); let i = 0, html = '';
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const isTable = k => lines[k].includes('|') && k+1 < lines.length && isSep(lines[k+1]);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const LIST = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;
  while (i < lines.length){
    const l = lines[i]; let m;
    if (/^\s*```/.test(l)){
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/))){
      const L = m[1].length;
      html += `<h${L} id="${esc(sl(m[2]))}">${hooks.heading ? hooks.heading(m[2], L) : inlineMd(m[2])}</h${L}>`; i++; continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ html += '<hr>'; i++; continue; }
    if (isTable(i)){
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      html += `<table><thead><tr>${head.map(c => `<th>${inlineMd(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    if (LIST.test(l)){
      const items = [];
      while (i < lines.length && LIST.test(lines[i])){ const mm = lines[i].match(LIST); items.push({ind:mm[1].length, ord:/\d/.test(mm[2]), text:mm[3]}); i++; }
      html += mdList(items); continue;
    }
    if (/^\s*>/.test(l)){
      const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      html += `<blockquote>${buf.map(inlineMd).join('<br>')}</blockquote>`; continue;
    }
    if (!l.trim()){ i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*>)/.test(lines[i]) && !LIST.test(lines[i]) && !isTable(i)) buf.push(lines[i++]);
    html += `<p>${buf.map(inlineMd).join('<br>')}</p>`;
  }
  return html;
}

/* タスクから参照されている仕様番号 → タスクID */
function taskRefMap(){
  const m = {};
  for (const t of state.tasks){
    const txt = [t.title, t.memo, ...t.logs.map(l => l.text), ...t.links.map(l => l.label)].join(' ');
    for (const r of new Set([...txt.matchAll(REF_RE)].map(x => x[1]))) (m[r] ??= []).push(t.id);
  }
  return m;
}
function specHeading(txt, L, refs, pinRefs = {}){
  let m = txt.match(/^([A-Z]{1,3}\d+(?:\.\d+)*)\s+(.*)$/);
  if (m && L >= 3){
    const ids = refs[m[1]] || [], pins = pinRefs[m[1]] || [];
    const btns = ids.map(id => `<button class="ref" data-task="${id}" title="関連タスク: ${esc(task(id)?.title)}">#${id} ${esc(st(task(id).status).label)}</button>`)
      .concat(pins.map(x => `<button class="ref pinref" data-sch="${x.sch}" data-pin="${x.pin}" title="回路図の注記: ${esc(x.label)}">図 P${x.page}-${x.pin}</button>`));
    return `<span class="no">${m[1]}</span>${inlineMd(m[2])}${btns.length ? `<span class="refs">${btns.join('')}</span>` : ''}`;
  }
  m = txt.match(/^(\d+)\.\s+(.*)$/);
  if (m && L === 2) return `<span class="no">${m[1]}.</span>${inlineMd(m[2])}`;
  return inlineMd(txt);
}

function insertSpec(kind){
  const ta = $('#specMd'); if (!ta) return;
  const v = ta.value, lines = v.split('\n');
  const cur = v.slice(0, ta.selectionStart).split('\n').length - 1;
  const hl = i => { const m = lines[i].match(/^(#{1,6})\s/); return m ? m[1].length : 0; };
  let lvl = 0; for (let i = cur; i >= 0; i--){ if (hl(i)){ lvl = hl(i); break; } }
  const snip = {
    item:  ['# 新しい項目', '新しい項目'],
    child: ['#'.repeat(Math.min(6, lvl + 1)) + ' 新しい子項目', '新しい子項目'],
    table: ['| 項目 | Min | Typ | Max | 単位 |\n|---|---|---|---|---|\n| 項目名 |  |  |  |  |\n', '項目名'],
  }[kind];
  let pos;
  if (kind === 'table'){ pos = ta.selectionEnd; const eol = v.indexOf('\n', pos); pos = eol === -1 ? v.length : eol; }
  else {
    // 項目: 現在の大項目ブロックの後ろ / 子項目: 現在の項目（配下を含む）の後ろ に挿入
    const stop = kind === 'item' ? 1 : (lvl || 1);
    let end = lines.length;
    for (let i = cur + 1; i < lines.length; i++){ const L = hl(i); if (L && L <= stop){ end = i; break; } }
    while (end > 0 && !lines[end-1].trim()) end--;

  const before = v.slice(0, pos);
  const pre = !before ? '' : before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
  const ins = pre + snip[0];
  ta.value = before + ins + v.slice(pos);
  const s0 = before.length + ins.indexOf(snip[1]);
  ta.focus(); ta.setSelectionRange(s0, s0 + snip[1].length);
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}

    if (v) s.prefix = v;
    t.classList.toggle('bad', !v || dupPrefix(doc, s));
    sv.querySelectorAll('.s-foot span').forEach((el, k) => el.lastChild.textContent = ` → ${s.prefix}${['1','1.1','1.1.1'][k]}`);
  }
  else if (t.dataset.m) doc[t.dataset.m] = t.value;
  else return;
  save(); renderSpecSide(); renderSpecPreview();
});
sv.addEventListener('change', e => {
  const t = e.target, doc = curDoc();
  if (t.id === 'secKind'){ const s = curSec(); s.kind = t.value; if (s.kind === 'spec' && !s.prefix) s.prefix = nextPrefix(doc); save(); renderSpec(); }
  if (t.id === 'specDocSel'){ specId = +t.value; specSecId = null; renderSpec(); $('#specPreview').scrollTop = 0; }
});
sv.addEventListener('click', e => { if (e.target.id === 'specMd') followCursor(); });
sv.addEventListener('keyup', e => { if (e.target.id === 'specMd' && /^(Arrow|Page|Home|End)/.test(e.key)) followCursor(); });
sv.addEventListener('keydown', e => {
  if (e.target.id === 'specMd' && e.key === 'Tab' && !e.isComposing){
    e.preventDefault(); const ta = e.target, p = ta.selectionStart;
    ta.setRangeText('  ', p, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', {bubbles:true}));
  }
});
/* タスク側の [A1.1] リンク → 仕様書へ */
document.addEventListener('click', e => {
  const a = e.target.closest('a.specref'); if (!a) return;
  e.preventDefault(); gotoSpecRef(a.dataset.spec);
});

render();
scrollToToday();
</script>
</body>
